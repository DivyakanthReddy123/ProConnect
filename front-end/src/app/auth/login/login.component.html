<div class="auth-shell">
  <div class="auth-card login-card">
    <div class="auth-logo" aria-hidden="true">
      <svg fill="currentColor" height="48" viewBox="0 0 40 48" width="40">
        <clipPath id="login-logo-clip"><path d="m0 0h40v48h-40z" /></clipPath>
        <g clip-path="url(#login-logo-clip)">
          <path d="m25.0887 5.05386-3.933-1.05386-3.3145 12.3696-2.9923-11.16736-3.9331 1.05386 3.233 12.0655-8.05262-8.0526-2.87919 2.8792 8.83271 8.8328-10.99975-2.9474-1.05385625 3.933 12.01860625 3.2204c-.1376-.5935-.2104-1.2119-.2104-1.8473 0-4.4976 3.646-8.1436 8.1437-8.1436 4.4976 0 8.1436 3.646 8.1436 8.1436 0 .6313-.0719 1.2459-.2078 1.8359l10.9227 2.9267 1.0538-3.933-12.0664-3.2332 11.0005-2.9476-1.0539-3.933-12.0659 3.233 8.0526-8.0526-2.8792-2.87916-8.7102 8.71026z" />
          <path d="m27.8723 26.2214c-.3372 1.4256-1.0491 2.7063-2.0259 3.7324l7.913 7.9131 2.8792-2.8792z" />
          <path d="m25.7665 30.0366c-.9886 1.0097-2.2379 1.7632-3.6389 2.1515l2.8794 10.746 3.933-1.0539z" />
          <path d="m21.9807 32.2274c-.65.1671-1.3313.2559-2.0334.2559-.7522 0-1.4806-.102-2.1721-.2929l-2.882 10.7558 3.933 1.0538z" />
          <path d="m17.6361 32.1507c-1.3796-.4076-2.6067-1.1707-3.5751-2.1833l-7.9325 7.9325 2.87919 2.8792z" />
          <path d="m13.9956 29.8973c-.9518-1.019-1.6451-2.2826-1.9751-3.6862l-10.95836 2.9363 1.05385 3.933z" />
        </g>
      </svg>
    </div>

    <div class="auth-heading-block">
      <h1>Welcome back!</h1>
      <p>First time here? <a routerLink="/signup">Sign up for free</a></p>
    </div>

    <form class="auth-form" name="form" #loginform="ngForm" (ngSubmit)="f.form.valid && login(loginform)" #f="ngForm" novalidate>
      <input
        class="auth-input"
        type="email"
        name="username"
        [(ngModel)]="model.username"
        #username="ngModel"
        required
        placeholder="Your email"
      />
      <small *ngIf="f.submitted && !username.valid" class="field-error">Email is required</small>

      <input
        class="auth-input"
        type="password"
        name="password"
        [(ngModel)]="model.password"
        #password="ngModel"
        required
        placeholder="Your password"
      />
      <small *ngIf="f.submitted && !password.valid" class="field-error">Password is required</small>

      <div *ngIf="loginerror && dangerBox" class="auth-error" role="alert">
        <span>{{loginerror.error.message}}{{loginmsg}}</span>
        <button type="button" aria-label="Close" (click)="dangerBox = false">&times;</button>
      </div>

      <button [disabled]="loading" class="auth-primary-btn" type="submit">
        <span *ngIf="!loading">Sign in</span>
        <span *ngIf="loading">Signing in...</span>
      </button>

      <a class="password-link" href="javascript:void(0)">Forgot password?</a>

      <div class="auth-separator">
        <span></span>
        <small>OR</small>
        <span></span>
      </div>

      <button class="auth-outline-btn" type="button" routerLink="/signup">Create a new account</button>
    </form>

    <p class="auth-terms">
      You acknowledge that you read, and agree, to our
      <a href="javascript:void(0)">Terms of Service</a> and our
      <a href="javascript:void(0)">Privacy Policy</a>.
    </p>
  </div>
</div>
