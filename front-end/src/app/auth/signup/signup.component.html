<div class="auth-shell">
  <div class="signup-card">
    <div class="auth-card-header">
      <div class="auth-logo" aria-hidden="true">
        <svg fill="currentColor" height="48" viewBox="0 0 40 48" width="40">
          <clipPath id="signup-logo-clip"><path d="m0 0h40v48h-40z" /></clipPath>
          <g clip-path="url(#signup-logo-clip)">
            <path d="m25.0887 5.05386-3.933-1.05386-3.3145 12.3696-2.9923-11.16736-3.9331 1.05386 3.233 12.0655-8.05262-8.0526-2.87919 2.8792 8.83271 8.8328-10.99975-2.9474-1.05385625 3.933 12.01860625 3.2204c-.1376-.5935-.2104-1.2119-.2104-1.8473 0-4.4976 3.646-8.1436 8.1437-8.1436 4.4976 0 8.1436 3.646 8.1436 8.1436 0 .6313-.0719 1.2459-.2078 1.8359l10.9227 2.9267 1.0538-3.933-12.0664-3.2332 11.0005-2.9476-1.0539-3.933-12.0659 3.233 8.0526-8.0526-2.8792-2.87916-8.7102 8.71026z" />
            <path d="m27.8723 26.2214c-.3372 1.4256-1.0491 2.7063-2.0259 3.7324l7.913 7.9131 2.8792-2.8792z" />
            <path d="m25.7665 30.0366c-.9886 1.0097-2.2379 1.7632-3.6389 2.1515l2.8794 10.746 3.933-1.0539z" />
            <path d="m21.9807 32.2274c-.65.1671-1.3313.2559-2.0334.2559-.7522 0-1.4806-.102-2.1721-.2929l-2.882 10.7558 3.933 1.0538z" />
            <path d="m17.6361 32.1507c-1.3796-.4076-2.6067-1.1707-3.5751-2.1833l-7.9325 7.9325 2.87919 2.8792z" />
            <path d="m13.9956 29.8973c-.9518-1.019-1.6451-2.2826-1.9751-3.6862l-10.95836 2.9363 1.05385 3.933z" />
          </g>
        </svg>
      </div>
      <h1>Create an account</h1>
      <p>Welcome! Create an account to get started.</p>
    </div>

    <form class="signup-form" name="form" #signupForm="ngForm" (ngSubmit)="signup(signupForm)" novalidate>
      <div class="form-field role-field">
        <label for="signupRole">Role</label>
        <div class="select-wrap">
          <select id="signupRole" name="signupRole" [(ngModel)]="signupRole">
            <option value="PROFESSIONAL">Job Seeker / Professional</option>
            <option value="RECRUITER">Recruiter</option>
          </select>
        </div>
      </div>

      <div class="two-col">
        <div class="form-field">
          <label for="name">First name</label>
          <input type="text" name="name" id="name" [(ngModel)]="user.name" #name="ngModel" required />
        </div>
        <div class="form-field">
          <label for="surname">Last name</label>
          <input type="text" name="surname" id="surname" [(ngModel)]="user.surname" #surname="ngModel" required />
        </div>
      </div>

      <div class="form-field">
        <label for="username">Email address</label>
        <input type="email" name="username" id="username" [(ngModel)]="user.username" #username="ngModel" required />
      </div>

      <div class="form-field">
        <label for="phoneNumber">Phone number</label>
        <input type="text" name="phoneNumber" id="phoneNumber" [(ngModel)]="user.phoneNumber" #phone="ngModel" required />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" [(ngModel)]="user.password" #password="ngModel" required />
      </div>

      <div class="form-field">
        <label for="passwordConfirm">Confirm password</label>
        <input type="password" name="passwordConfirm" id="passwordConfirm" [(ngModel)]="user.passwordConfirm" #passwordConfirm="ngModel" required />
      </div>

      <div *ngIf="signupRole === 'RECRUITER'" class="recruiter-box">
        <div class="section-title">
          <strong>Recruiter details</strong>
          <span>These details will be shown on your recruiter profile.</span>
        </div>

        <div class="form-field">
          <label for="currentCompany">Company name</label>
          <input type="text" name="currentCompany" id="currentCompany" [(ngModel)]="user.currentCompany" [required]="signupRole === 'RECRUITER'" />
        </div>

        <div class="form-field">
          <label for="currentJob">Designation</label>
          <input type="text" name="currentJob" id="currentJob" placeholder="Recruiter / Talent Acquisition" [(ngModel)]="user.currentJob" [required]="signupRole === 'RECRUITER'" />
        </div>

        <div class="two-col">
          <div class="form-field">
            <label for="city">Location</label>
            <input type="text" name="city" id="city" [(ngModel)]="user.city" [required]="signupRole === 'RECRUITER'" />
          </div>
          <div class="form-field">
            <label for="website">Website</label>
            <input type="text" name="website" id="website" [(ngModel)]="user.website" placeholder="https://" />
          </div>
        </div>
      </div>

      <div class="form-field">
        <label for="profilephoto">Profile photo <span class="required">*</span></label>
        <input class="file-input" #profilephoto id="profilephoto" type="file" accept=".jpg,.jpeg,.png" (change)="setProfilePhoto(profilephoto)" required />
        <small *ngIf="profilePhoto && (profilePhoto.type !='image/jpeg' && profilePhoto.type !='image/png') && submitattempt" class="field-error">Image file must be jpeg or png</small>
        <small *ngIf="!profilePhoto && submitattempt" class="field-error">Please choose profile photo</small>
      </div>

      <label class="terms-row">
        <input type="checkbox" name="termsAccepted" ngModel required />
        <span>I agree to the <a href="javascript:void(0)">Terms</a> and <a href="javascript:void(0)">Conditions</a></span>
      </label>

      <div *ngIf="signuperror && dangerBox && profilePhoto" class="auth-error" role="alert">
        <span>{{signuperror.error.message}}</span>
        <button type="button" aria-label="Close" (click)="dangerBox = false">&times;</button>
      </div>

      <div *ngIf="submitattempt && (user.passwordConfirm || user.password) && user.password !== user.passwordConfirm" class="auth-error" role="alert">
        <span>Passwords do not match</span>
      </div>

      <button class="auth-primary-btn" [disabled]="loading || !signupForm.valid" type="submit">
        <span *ngIf="!loading">Create free account</span>
        <span *ngIf="loading">Creating account...</span>
      </button>
    </form>

    <div class="signup-footer">
      Already have an account? <a routerLink="/login">Sign in</a>
    </div>
  </div>
</div>
