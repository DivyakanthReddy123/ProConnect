<app-navbar></app-navbar>
<div class="container" id="feedcards"><div class="feed-grid"><aside class="feed-left"><div class="card profile-card-modern mb-3"><div class="profile-banner"></div><div class="profile-card-avatar"><app-avatar [src]="user.profilePicture ? displayProfilePhoto() : null" [name]="user.name + ' ' + user.surname" [size]="72"></app-avatar></div><div class="card-body text-center"><h5 class="mb-1">{{user.name}} {{user.surname}}</h5><p class="text-muted mb-3" *ngIf="user.currentJob && user.currentCompany">{{user.currentJob}} at {{user.currentCompany}}</p><div class="d-flex justify-content-between border-top border-bottom py-2 mb-3"><span class="text-muted">Connections</span><strong>{{network.length}}</strong></div><button *ngIf="userDetails" type="button" class="btn btn-primary w-100" (click)="goToProfile()">View profile</button></div></div><div class="card mb-3"><div class="card-body"><h3 class="right-rail-title">My Network</h3><app-empty-state *ngIf="network.length==0" title="No connections yet" message="Start connecting with people to build your feed."></app-empty-state><div *ngIf="network.length!=0"><div *ngFor="let nuser of network | slice:0:4" class="network-row"><app-avatar [src]="nuser.profilePicture ? displayUserPhoto(nuser) : null" [name]="nuser.name + ' ' + nuser.surname" [size]="42"></app-avatar><button [routerLink]="['/users/',nuser.id]" type="button" class="btn text-start p-0"><strong>{{nuser.name}} {{nuser.surname}}</strong><br><small class="text-muted" *ngIf="nuser.currentJob && nuser.currentCompany">{{nuser.currentJob}} at {{nuser.currentCompany}}</small></button></div></div><a href="/network" class="btn btn-outline-primary w-100 mt-3">View my Network</a></div></div></aside><main class="feed-center"><div class="card mb-3" id="addPost"><app-create-post (updateView)="recieveRefreshCommand($event)"></app-create-post></div><div id="allPosts"><app-postsinfeed></app-postsinfeed></div></main><aside class="feed-right"><div class="card"><div class="card-body"><h3 class="right-rail-title">People you may know</h3><div *ngFor="let nuser of network | slice:0:5" class="mini-person"><app-avatar [src]="nuser.profilePicture ? displayUserPhoto(nuser) : null" [name]="nuser.name + ' ' + nuser.surname" [size]="38"></app-avatar><div class="flex-grow-1"><strong>{{nuser.name}} {{nuser.surname}}</strong><div class="text-muted small" *ngIf="nuser.currentJob">{{nuser.currentJob}}</div></div><button class="btn btn-outline-primary btn-sm" [routerLink]="['/users/',nuser.id]">View</button></div><app-empty-state *ngIf="network.length==0" title="No suggestions yet" message="Suggestions will show after you add connections."></app-empty-state></div></div></aside></div></div>
<app-footer></app-footer>
