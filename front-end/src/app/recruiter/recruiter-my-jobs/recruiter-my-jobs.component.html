<app-navbar></app-navbar>
<div class="container recruiter-shell">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div><h1>My Posted Jobs</h1><p class="muted">Manage jobs created by you.</p></div>
    <button class="btn btn-primary" routerLink="/recruiter/post-job">Post New Job</button>
  </div>
  <div *ngIf="jobs.length === 0" class="card p-4 text-center text-muted">No jobs posted yet.</div>
  <div *ngFor="let job of jobs" class="card action-card p-4 mb-3">
    <div class="d-flex justify-content-between">
      <div>
        <h3>{{job.title}}</h3>
        <p class="muted mb-1">{{job.companyName}} · {{job.location}} · {{job.jobType}} · {{job.workMode}}</p>
        <span class="pill">{{job.status || 'ACTIVE'}}</span><span class="pill">{{job.usersApplied?.length || 0}} applicants</span>
      </div>
      <div>
        <button class="btn btn-sm btn-outline-primary me-2" [routerLink]="['/recruiter/jobs', job.id, 'applicants']">Applicants</button>
        <button class="btn btn-sm btn-outline-warning me-2" (click)="closeJob(job)">Close</button>
        <button class="btn btn-sm btn-outline-danger" (click)="deleteJob(job)">Delete</button>
      </div>
    </div>
    <p class="mt-3 mb-0">{{job.description}}</p>
  </div>
</div>
<app-footer></app-footer>
